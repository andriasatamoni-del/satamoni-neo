name: CI

# Runs on every pull request and on pushes to main. Everything runs against a THROW-AWAY Postgres service container
# (database name contains "test"; the suite's safety guard test/safety/assert-disposable-db.js refuses anything else).
# No production secrets are used here and the token is read-only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: satamoni_neo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test123@localhost:5432/satamoni_neo_test
      JWT_SECRET: ci_test_secret_not_for_production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in the root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # the backup/restore drill tests call pg_dump/pg_restore, which must be the same major version as the server or newer
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter satamoni-neo-backend

      # the import-*-from-legacy specs build their fixture tables in an EMPTY database of their own (the legacy system's stand-in)
      - name: Create the legacy-fixture database used by the import specs
        env:
          PGPASSWORD: test123
        run: psql -h localhost -U postgres -c 'CREATE DATABASE satamoni_legacy_fixture_test'

      - name: Typecheck
        working-directory: backend
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: backend
        run: pnpm run test:unit

      - name: Integration tests (real PostgreSQL, strict accounting)
        working-directory: backend
        run: pnpm run test:integration --forceExit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in the root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter satamoni-neo-frontend
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm run build
