name: Daily database backup + restore drill

# OPS-1 / BL-13 (Phase 3.1). Fixes the original failure: `defaults.run.working-directory: backend` applied to the
# very first step, which runs BEFORE checkout, so the job died with "No such file or directory" and no backup
# was ever produced. Now: no job-level working-directory; each step that needs the repo sets it explicitly.
#
# Properties (enforced by backend/test/unit/security/workflow-security.spec.ts and backup-workflow.spec.ts):
#  * Fails LOUDLY (exit 1) when DATABASE_URL or BACKUP_ENCRYPTION_KEY is missing - never silently skipped.
#  * The dump is verified (size, pg_restore --list, sha256) and restored into a throw-away Postgres service
#    (restore drill) before anything is uploaded.
#  * The dump contains every customer/payroll/financial record and password hashes. It is ENCRYPTED (AES-256,
#    gpg symmetric with integrity protection) BEFORE upload, so even on a public repository the artifact is
#    useless without BACKUP_ENCRYPTION_KEY. Plain dumps are never uploaded.
#  * Workflow artifacts (<= 90 days) are NOT a long-term backup strategy. If BACKUP_S3_BUCKET etc. are
#    configured, the encrypted dump is also copied to independent S3-compatible storage and the daily /
#    monthly / yearly retention plan is applied there (see docs/BACKUP_AND_RECOVERY.md).
#  * Runs against a protected environment so the production secret needs reviewer-governed access.
#  * The job runs ONLY from `main` (job-level `if`, evaluated before the environment, the secrets or any service
#    container are touched). A manual run from any other branch is skipped: it never reaches a step that uses a
#    secret or connects to a database. Scheduled runs always execute on the default branch. NOTE: a skipped run
#    shows up green in the Actions tab - "skipped" is not "backed up". Check for the encrypted artifact.
#  * Each encrypted dump is published together with its SHA-256 (`*.dump.gpg` + `*.dump.gpg.sha256`); verify the
#    checksum BEFORE decrypting (docs/BACKUP_AND_RECOVERY.md). Plaintext dumps are never uploaded.
#  * The connection to the source database verifies the server certificate (chain + host name): pg_dump uses verify-full, the
#    comparison and server-identity check use rejectUnauthorized:true. A provider certificate that is not publicly trusted needs
#    the CA in the environment secret BACKUP_DB_SSL_CA (pinned). `vars.BACKUP_DB_TLS_MODE=insecure-skip-verify` is a loud,
#    explicit opt-out (never the default). See docs/BACKUP_AND_RECOVERY.md.
#  * `environment: production-backup` only NAMES an environment. Required reviewers and the "main only" deployment
#    branch rule are GitHub settings that this file cannot enforce - see docs/BACKUP_AND_RECOVERY.md.
#  * A failed (or cancelled) run opens ONE GitHub issue, "ALERT: scheduled database backup failed" (further failures add a
#    comment to it); the next successful run comments and closes it. Only the separate `report` job can write issues
#    (`issues: write`); it has no secrets, no environment, no checkout and no repository-write scope. The issue contains only
#    the run link - never log content. Owner setup: Issues enabled and the repository watched - docs/BACKUP_AND_RECOVERY.md.
on:
  schedule:
    - cron: "7 1 * * *" # 01:07 UTC = after Cairo midnight (after business-day close)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # least privilege: checkout needs contents:read; artifact upload uses the runtime token (no extra scope).
    # Stated at job level too so a future workflow-level change cannot widen this job silently.
    permissions:
      contents: read
    environment: production-backup
    services:
      # throw-away server for the restore drill only - never production
      drill-db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKUP_DIR: ${{ github.workspace }}/backups
    steps:
      - name: Validate required configuration (values are never printed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_DB_TLS_MODE: ${{ vars.BACKUP_DB_TLS_MODE }}
        run: |
          set -eu
          missing=0
          case "${BACKUP_DB_TLS_MODE:-verify}" in
            verify) ;;
            insecure-skip-verify) echo "::warning::BACKUP_DB_TLS_MODE=insecure-skip-verify - the source database certificate is NOT verified (man-in-the-middle possible). Pin the CA in BACKUP_DB_SSL_CA and remove this variable." ;;
            *) echo "::error::BACKUP_DB_TLS_MODE must be 'verify' (default) or 'insecure-skip-verify'"; missing=1 ;;
          esac
          if [ -z "${DATABASE_URL:-}" ]; then echo "::error::secret DATABASE_URL is not configured - backup cannot run"; missing=1; fi
          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then echo "::error::secret BACKUP_ENCRYPTION_KEY is not configured - refusing to upload an unencrypted dump"; missing=1; fi
          if [ "${#BACKUP_ENCRYPTION_KEY}" -lt 32 ]; then echo "::error::BACKUP_ENCRYPTION_KEY must be at least 32 characters"; missing=1; fi
          [ "$missing" -eq 0 ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm via Node's built-in corepack (version from "packageManager" in the root package.json). Not pnpm/action-setup:
      # only official actions/* are allowed (workflow-security.spec.ts). Before setup-node so `cache: pnpm` finds pnpm.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pg_dump must be the same major version as the server or newer
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter satamoni-neo-backend

      # The source database certificate is VERIFIED (chain + host name) by pg_dump, the comparison and the server-identity check.
      # By default it must chain to a CA the runner trusts. If the provider's certificate is not publicly trusted, store the CA
      # certificate (PEM, certificate only) in the environment secret BACKUP_DB_SSL_CA: it is then the only CA accepted (pinning).
      - name: Prepare TLS trust for the source database (optional pinned CA)
        env:
          DB_CA: ${{ secrets.BACKUP_DB_SSL_CA }}
        run: |
          set -eu
          if [ -n "${DB_CA:-}" ]; then
            umask 077
            printf '%s\n' "$DB_CA" > "$RUNNER_TEMP/db-ca.pem"
            if grep -q 'PRIVATE KEY' "$RUNNER_TEMP/db-ca.pem"; then echo "::error::BACKUP_DB_SSL_CA contains a private key - give the CERTIFICATE only"; exit 1; fi
            grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/db-ca.pem" || { echo "::error::BACKUP_DB_SSL_CA is not a PEM certificate"; exit 1; }
            echo "PGSSLROOTCERT=$RUNNER_TEMP/db-ca.pem" >> "$GITHUB_ENV"
            echo "RESTORE_DRILL_SOURCE_SSL_CA=$RUNNER_TEMP/db-ca.pem" >> "$GITHUB_ENV"
            echo "Using the pinned CA from BACKUP_DB_SSL_CA."
          else
            echo "BACKUP_DB_SSL_CA not set: the database certificate must chain to a CA trusted by the runner."
          fi

      - name: Backup (pg_dump -Fc) + integrity verification
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL: "true"
          BACKUP_DB_TLS_MODE: ${{ vars.BACKUP_DB_TLS_MODE }}
        run: pnpm exec ts-node scripts/backup/backup.ts

      - name: Restore drill (into throw-away Postgres service)
        working-directory: backend
        env:
          RESTORE_DRILL_DATABASE_URL: postgresql://postgres:drill@localhost:5432/postgres
          # compare the restored copy with the live source on critical data (the source may have grown since the snapshot)
          RESTORE_DRILL_COMPARE_SOURCE_URL: ${{ secrets.DATABASE_URL }}
          RESTORE_DRILL_SOURCE_IS_LIVE: "true"
          RESTORE_DRILL_SOURCE_SSL: "true"
          BACKUP_DB_TLS_MODE: ${{ vars.BACKUP_DB_TLS_MODE }}
        run: pnpm exec ts-node scripts/backup/restore-drill.ts

      - name: Encrypt dump (AES-256), prove the key decrypts it, and record the SHA-256 of the ENCRYPTED file
        working-directory: backend
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dumps=("$BACKUP_DIR"/*.dump)
          [ "${#dumps[@]}" -gt 0 ] || { echo "::error::no dump found to encrypt"; exit 1; }
          for f in "${dumps[@]}"; do
            printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$f.gpg" | sha256sum | cut -d' ' -f1 > "$f.dec.sha256"
            sha256sum "$f" | cut -d' ' -f1 > "$f.src.sha256"
            cmp "$f.dec.sha256" "$f.src.sha256"
            # checksum of the encrypted artifact itself (sha256sum format, relative name) - what a downloader verifies before decrypting
            (cd "$BACKUP_DIR" && sha256sum "$(basename "$f").gpg" > "$(basename "$f").gpg.sha256" && sha256sum --check --strict "$(basename "$f").gpg.sha256")
            rm -f "$f" "$f.sha256" "$f.dec.sha256" "$f.src.sha256"   # plaintext (and its checksum) never leaves this job
          done
          ls -l "$BACKUP_DIR"

      - name: Verify the encrypted files against their checksums and make sure no plaintext is left (no secrets used)
        working-directory: backend
        run: |
          set -euo pipefail
          shopt -s nullglob
          encrypted=("$BACKUP_DIR"/*.dump.gpg)
          [ "${#encrypted[@]}" -gt 0 ] || { echo "::error::no encrypted backup produced"; exit 1; }
          pnpm exec ts-node scripts/backup/verify-encrypted-backup.ts "${encrypted[@]}"
          leftover=$(find "$BACKUP_DIR" -type f ! -name '*.dump.gpg' ! -name '*.dump.gpg.sha256' | wc -l)
          [ "$leftover" -eq 0 ] || { echo "::error::unexpected non-encrypted file left in the backup directory"; exit 1; }

      - name: Copy to independent S3-compatible storage + apply tiered retention (only when configured)
        working-directory: backend
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_S3_BUCKET:-}" ]; then
            echo "::warning::BACKUP_S3_BUCKET not configured - only 30-day workflow artifacts exist. This is NOT a long-term backup."
            exit 0
          fi
          ep=""; if [ -n "${BACKUP_S3_ENDPOINT:-}" ]; then ep="--endpoint-url $BACKUP_S3_ENDPOINT"; fi
          aws s3 cp $ep "$BACKUP_DIR"/ "s3://$BACKUP_S3_BUCKET/satamoni-neo/" --recursive --exclude "*" --include "*.dump.gpg" --include "*.dump.gpg.sha256"
          aws s3 ls $ep "s3://$BACKUP_S3_BUCKET/satamoni-neo/" | awk '{print $4}' | grep '\.dump\.gpg$' > "$RUNNER_TEMP/remote-names.txt"
          pnpm exec ts-node scripts/backup/retention-plan.ts --names-file "$RUNNER_TEMP/remote-names.txt" --suffix .gpg --print-delete > "$RUNNER_TEMP/to-delete.txt"
          while read -r name; do [ -n "$name" ] && aws s3 rm $ep "s3://$BACKUP_S3_BUCKET/satamoni-neo/$name" && aws s3 rm $ep "s3://$BACKUP_S3_BUCKET/satamoni-neo/$name.sha256"; done < "$RUNNER_TEMP/to-delete.txt"

      - name: Upload encrypted backup artifact (encrypted dump + its SHA-256 only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satamoni-neo-backup-encrypted-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/backups/*.dump.gpg
            ${{ github.workspace }}/backups/*.dump.gpg.sha256
          retention-days: 30
          if-no-files-found: error

  # Failure alert. Separate job on purpose: the backup job keeps `contents: read` only, while this one gets `issues: write`
  # and nothing else. It never sees a production secret (no `secrets.*`, no environment) and never checks code out.
  report:
    needs: backup
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RESULT: ${{ needs.backup.result }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the backup alert issue
        run: |
          set -euo pipefail
          TITLE="ALERT: scheduled database backup failed"
          open=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title --jq '[.[] | select(.title == "ALERT: scheduled database backup failed")][0].number // empty')
          case "$RESULT" in
            success)
              if [ -n "$open" ]; then
                gh issue comment "$open" --repo "$REPO" --body "A backup run succeeded: $RUN_URL. Closing this alert. Confirm the encrypted artifact (and its .sha256) exists on that run."
                gh issue close "$open" --repo "$REPO"
              fi
              ;;
            failure|cancelled)
              body="The database backup workflow ended with result '$RESULT' (trigger: $EVENT).

          Run: $RUN_URL

          Until a run succeeds there is NO new backup. Open the run, read the failed step, fix it, then run the workflow manually from main.
          Likely causes: BACKUP_ENCRYPTION_KEY or DATABASE_URL missing from the production-backup environment, the database unreachable, a Postgres version newer than the pg_dump 17 client, or the restore drill failing.
          Do not paste logs, URLs or secrets into this issue."
              if [ -n "$open" ]; then
                gh issue comment "$open" --repo "$REPO" --body "Another failed run (result '$RESULT', trigger: $EVENT): $RUN_URL"
              else
                gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
              fi
              ;;
            skipped)
              echo "Backup job was skipped: nothing to report."
              ;;
            *)
              echo "::error::unexpected backup result"
              exit 1
              ;;
          esac
