# Blueprint لـRender - مجهود مبذول بأفضل معرفة متاحة، لكن غير مُتحقَّق منه ضد توثيق Render الحالي
# (egress لـrender.com محظور في بيئة التطوير دي وقت كتابة الملف ده). لو "New + -> Blueprint" رفض
# الملف أو جزء منه، ارجع لـDEPLOYMENT.md (الخطوات اليدوية عبر لوحة تحكم Render - مضمونة ومتحقَّق منها
# فعليًا بتشغيل نسخة production محلية).
databases:
  - name: satamoni-neo-db
    plan: free
    databaseName: satamoni_neo
    user: satamoni_neo

services:
  - type: web
    name: satamoni-neo-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: satamoni-neo-db
          property: connectionString
      - key: PGSSL
        value: "false" # Render Internal Database URL - مش لازم SSL. لو استخدمت External URL بدّلها true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "12h"
      - key: ACCOUNTING_ENFORCEMENT
        value: "strict" # Phase 3.1: القيد المحاسبي جزء من نفس transaction العملية (راجع backend/docs/PHASE31_REMEDIATION.md)
      - key: FRONTEND_ORIGIN
        sync: false # حدّده يدوي برابط الفرونت إند الفعلي بعد ما ينتشر (راجع DEPLOYMENT.md) - من
        # غيره الـCORS بيرجع لـ localhost:5173 بس (مفيد وقت التطوير، مش كافي في production)
      # بوت واتساب/ماسنجر/إنستجرام - كلهم اختياريين، راجع backend/docs/WHATSAPP-BOT.md
      - key: GEMINI_API_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_STAFF_NOTIFY_NUMBER
        sync: false
      # رسايل SMS للعميل (تأكيد + طلب تقييم) - اختياري، راجع backend/docs/WHATSAPP-BOT.md
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_AUTH_HEADER
        sync: false
      - key: PUBLIC_APP_URL
        sync: false # رابط الفرونت إند العام (لرابط التقييم) - لو فاضي بيستخدم أول FRONTEND_ORIGIN

  - type: web
    name: satamoni-neo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # لازم لأي SPA بـclient-side routing (React Router) - من غيرها أي
        # رابط غير "/" (زي "/login") بيرجّع 404 من سيرفر الاستضافة نفسه قبل ما الـJS يشتغل أصلًا
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # حدّده يدوي بعد ما الباك إند يتنشر ويبقى معروف رابطه (راجع DEPLOYMENT.md)
